name: Visit Streamlit app

on:
  schedule:
    # UTC; offset from the top of the hour to reduce schedule congestion.
    - cron: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/keep_alive.yml']

permissions:
  contents: read

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_URL: ${{ secrets.STREAMLIT_APP_URL || 'https://jex1235-coder-hw2-multiple-linear-regression-app-0qudfk.streamlit.app/' }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright and Chromium
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Open app, wake if asleep, and keep session open
        run: |
          python - <<'PY'
          import os
          import re
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeout

          url = os.environ.get("APP_URL", "").strip()
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname or not (
              parsed.hostname == "streamlit.app" or parsed.hostname.endswith(".streamlit.app")
          ):
              raise SystemExit("Set the STREAMLIT_APP_URL secret to your https://...streamlit.app URL")

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              page = browser.new_page()
              sockets = []
              page.on("websocket", lambda socket: sockets.append(socket.url))
              page.goto(url, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(10000)

              wake = page.get_by_text(re.compile(r"Yes, get this app back up!?", re.I)).first
              if wake.count() and wake.is_visible():
                  print("Sleeping page found; clicking wake control")
                  wake.click()
                  page.wait_for_timeout(10000)

              try:
                  page.locator('[data-testid="stApp"]').wait_for(state="visible", timeout=90000)
              except PlaywrightTimeout as exc:
                  raise SystemExit(f"Streamlit app did not become visible: {page.url}") from exc

              # Keep the browser session alive long enough for Streamlit's
              # WebSocket handshake and initial app render.
              page.wait_for_timeout(10000)
              if page.locator('[data-testid="stException"]').count():
                  raise SystemExit("Streamlit rendered an application exception")
              if not sockets:
                  raise SystemExit("App page rendered, but no WebSocket connection was observed")
              print(f"App rendered; observed {len(sockets)} WebSocket connection(s)")
              browser.close()
          PY
